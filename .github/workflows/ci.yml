name: CI

# Verification that does not depend on Vercel (#277, PRD #275).
#
# Before this, the only automatic signal a PR got was a Vercel deployment status: it type-checks but
# runs no tests, and when the account hit its 24h deploy quota on 2026-07-27 every PR lost its only
# check. Actions runs regardless.
#
# ── Why one workflow with a `gate` job, rather than several required checks ──────────────────────
# GitHub required status checks and conditional jobs deadlock: a PR that skips a job leaves that
# job's required check in "Expected — waiting for status" forever, and the PR can never merge. The
# first reaction to that is to switch branch protection off, which is the outcome the whole epic
# exists to avoid. Slow-Inc/MangaDock's ci.yml documents the same trap and the same fix.
#
# So: mark **only `gate`** as the required check in branch protection (#279). It always runs and fails
# only when a job that matters did not succeed.
#
# ── Why test/build are not path-filtered ────────────────────────────────────────────────────────
# The two workspaces are coupled: a change under nestjs/ alters what the frontend renders. Filtering
# would buy a couple of minutes and re-introduce the deadlock class above. The whole run is short.
#
# The browser suite (the `e2e` job, #278) is the one exception: it runs a production build + real
# Chromium against the PRODUCTION database, so it is slow and data-sensitive. It runs BY DEFAULT and
# is skipped only for paths that provably cannot affect the rendered site (docs, the knowledge vault,
# agent skills, workflow config). The trigger is inverted on purpose: `CLAUDE.md` requires E2E for
# every frontend change, and a `paths: nextjs/**` include would miss a change under nestjs/ that
# alters what the frontend renders. A spec (`nestjs/test/e2e-ci-is-wired.spec.ts`) holds the ignore
# list to provably-unrelated entries.
#
# The e2e job reads the PRODUCTION database, so a content change can fail CI with no code defect —
# documented, not silently tolerated. Fork PRs carry no secrets and cannot run it; the job detects
# the missing secrets and skips with a warning.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: test (both workspaces)
    runs-on: ubuntu-latest
    env:
      # `test/health.spec.ts` boots the whole AppModule, so it constructs DatabaseModule, which
      # refuses to build without a DATABASE_URL. A deliberately fake one is enough and keeps the
      # coverage: the guard only rejects an unset value or the `[YOUR-PASSWORD]` placeholder,
      # postgres.js does not connect until a query, and the health controller is dependency-free —
      # so all three probes answer without a database existing. Measured: 613 pass, 0 fail with no
      # env files present and only this value set.
      #
      # That boot is worth keeping in CI rather than excluding: it is the only check that catches a
      # broken DI graph, which `nest build` does not.
      DATABASE_URL: postgresql://postgres.ci:ci-not-a-real-password@127.0.0.1:6543/postgres
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `latest`: a Bun release must not be able to turn a green branch red with no diff.
      # 1.3.14 is the version the product is developed against.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      # No environment at all, deliberately. Measured on 2026-07-28: the suite needs none once
      # app/sitemap.ts's pure shaper is separated from its two database reads — before that split,
      # one test built a real Supabase client, and it was the only reason this job would have needed
      # a repository secret.
      - name: Unit tests (root entry point)
        run: bun run test

  build:
    name: build (type-check)
    runs-on: ubuntu-latest
    env:
      # `next build` prerenders pages that read Supabase, so it refuses to start with no URL+key.
      # Dummy values are enough and no repository secret is required: the data layer is DB-first with
      # a static fallback, so an unreachable host falls back to seed content and the build completes
      # (measured — with these exact values, exit 0).
      #
      # What this job therefore proves: the code compiles and every route renders. What it does NOT
      # prove: that the routes render real data. The Vercel deployment check still covers that, and
      # this job is here because `bun test` does not type-check — which is how a broken backend build
      # reached a PR head on 2026-07-26.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy_for_ci
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Build both workspaces (root entry point)
        run: bun run build

  # Real-browser suite against a production build + the PRODUCTION database (#278). Runs by default;
  # skips (inside the job) only for provably-unrelated paths or when the Supabase secrets are missing.
  e2e:
    name: e2e (browser suite — production database)
    runs-on: ubuntu-latest
    env:
      # The suite reads the PRODUCTION database through the frontend's client — a content change can
      # fail CI with no code defect. That is documented, not silently tolerated (#278).
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.BACKEND_URL || 'https://t4-fastwork-nestjs.vercel.app' }}
      # Only paths that provably cannot affect the rendered site may skip E2E. NEVER add a
      # site-affecting prefix here — nestjs/test/e2e-ci-is-wired.spec.ts fails if you do.
      E2E_IGNORE_PATHS: |
        ^docs/
        ^Obsidian-Fastwork/
        ^\.agents/
        ^\.claude/
        ^\.github/
        ^\.gitignore$
        \.md$
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Skip when the Supabase secrets are not configured
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::warning::Supabase E2E secrets not configured — skipping the browser suite (fork PRs have no secrets; until the repo secrets are set this is a documented no-op, not a pass)."
            echo "E2E_SKIPPED=true" >> "$GITHUB_ENV"
          fi

      - name: Skip when only unrelated paths changed
        if: ${{ env.E2E_SKIPPED != 'true' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            if [ -n "$base" ] && [ -n "$head" ]; then
              changed=$(git diff --name-only "$base...$head")
              unrelated=$(printf '%s\n' "$changed" | grep -vE "$(printf '%s\n' "$E2E_IGNORE_PATHS")" || true)
              if [ -z "$unrelated" ]; then
                echo "Only unrelated paths changed — skipping the browser suite."
                echo "E2E_SKIPPED=true" >> "$GITHUB_ENV"
              fi
            fi
          fi

      - name: Install Playwright chromium
        if: ${{ env.E2E_SKIPPED != 'true' }}
        run: bunx playwright install --with-deps chromium

      - name: Run the browser suite (production build, production database)
        if: ${{ env.E2E_SKIPPED != 'true' }}
        working-directory: nextjs
        run: bun run e2e

  gate:
    name: gate
    # Must run even when a dependency failed or was skipped — otherwise a failed job leaves the
    # required check unreported, which is the deadlock this job exists to prevent.
    if: ${{ always() }}
    needs: [test, build, e2e]
    runs-on: ubuntu-latest
    steps:
      # Both test and build are unconditional, so anything other than success is a real problem —
      # including `cancelled`. The e2e job skips INSIDE its steps (missing secrets / only unrelated
      # paths) and reports success; a real browser failure reports failure. `skipped` is accepted too,
      # so a future job-level conditional on e2e cannot deadlock the required check.
      - name: Verify required jobs
        run: |
          echo "test=${{ needs.test.result }} build=${{ needs.build.result }} e2e=${{ needs.e2e.result }}"
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::A required CI job did not succeed"
            exit 1
          fi
          if [ "${{ needs.e2e.result }}" != "success" ] && [ "${{ needs.e2e.result }}" != "skipped" ]; then
            echo "::error::The browser suite did not succeed"
            exit 1
          fi
          echo "CI gate passed."
